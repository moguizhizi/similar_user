neo4j:
  uri: "bolt://10.30.1.121:7687"
  username: "neo4j"
  password: "password"
  database: "neo4j"
  log_connection_caller: false

llm:
  base_url: "http://10.30.1.121:7999"
  api_key: ""
  model: "qwen3_5"
  timeout: 60
  max_retries: 3
  backoff_factor: 1.5

api:
  max_concurrent_predictions: 4

query:
  graph_path_limit:
    per_g_strategy: "band"
    bands:
      - max_g_count: 49
        per_g: 10
      - max_g_count: 199
        per_g: 6
      - per_g: 4
    max_limit_source: "total_paths"
  pattern_path_storage:
    output_dir: "data/pattern_paths"
  patient_path:
    window_days: 14
    query_family: "training_order_dual_window"
  score_pattern_paths:
    top_k: 150
  candidate_ranking:
    patterns:
      - "patient_game_patient"
      - "patient_disease_patient"
      - "patient_symptom_patient"
      - "patient_unknown_patient"
    candidate_top_k: 10
    total_score_match_top_k: 1
    disease_course_window_days: 14
    scoring:
      common_game_score_similarity: false
      game_similarity_with_diversity_score: false
      disease_course_secondary_ability: true
      set_same:
        disease: false
        symptom: false
        unknown: false
  training_task_prediction:
    task_top_k: 7
    prompt_candidate_compression_enabled: false
    save_prompt_enabled: false
    profile_candidate_training_window_days: null
    unlock_train_candidate_tasks_enabled: false
    similar_user_game_counts_weighting_enabled: false
    similar_user_game_counts_weighted_sort_enabled: false
    fallback_enabled: true
  training_task_evaluation:
    validation_enabled: true
    validation_mode: "score"
    workers: 1
    score_validation_url: "http://172.21.133.142:5008/training_task_score"
    algorithm_request_results_csv: "/home/temp/dataset/20260525_Algorithm_Request_Results/20260525_Algorithm_Request_Results.csv"
    score_validation_timeout: 10
  direct_entity_task_prediction:
    prompt_template_name: "TASK_PREDICTION_PROMPT_TEMPLATE_DIRECT_ENTITY_V1"
  direct_entity_path:
    window_days: 180
    direct_path_limit: 1000
    index_path: "data/pattern_paths/direct_entity_path_index.json"
  direct_entity_path_scoring:
    use_when_patient_exists: false

similarity:
  top_k: 20
  strategy: "graph"
  embedding:
    enabled: false
    dimension: 64

direct_path_cache:
  # enabled=true 时，build_direct_entity_paths.py 会从 sqlite_path 指向的 direct path SQLite 读取。
  enabled: false
  sqlite_path: "data/direct_path_cache/direct_paths.sqlite"
  incremental_enabled: true
  overlap_days: 1

user_cache:
  # 是否启用以 source/patient 为中心的本地缓存索引。
  enabled: true

  # 用户缓存索引 SQLite 路径；缓存文件路径会记录在该索引中。
  sqlite_path: "data/user_cache/cache_index.sqlite"

  # 患者路径 raw paths 的可复用天数；过期后需要重新构建患者路径。
  patient_raw_paths_valid_days: 30

  # direct entity 路径 raw paths 的可复用天数。
  direct_raw_paths_valid_days: 60

  # 患者路径打分结果 scored paths 的可复用天数；过期后需基于 raw paths 重新打分。
  patient_scored_paths_valid_days: 14

  # direct entity 路径打分结果 scored paths 的可复用天数。
  direct_scored_paths_valid_days: 60

  # topK 候选用户结果的可复用天数；两条候选链路共用该有效期。
  topk_candidates_valid_days: 7

  # topK 候选用户结果的 stale 可返回天数；超过 fresh 有效期但未超过该值时，可先返回旧结果并登记后台刷新。
  topk_candidates_stale_valid_days: 14

  # profile candidate tasks 缓存的可复用天数。
  profile_candidate_tasks_valid_days: 7

  # 命中候选缓存时，是否刷新候选用户 disease-course base date 以适配本次请求日期。
  refresh_candidate_base_date_on_hit: true

  # 构建 raw paths 时的并发 worker 数。
  raw_path_build_workers: 1

  # raw paths 构建失败后的最大重试次数。
  raw_path_build_max_retries: 2

  # raw paths 构建失败后每次重试前的等待秒数。
  raw_path_build_retry_sleep_seconds: 5

  # 刷新成功的 refresh job 记录保留天数；用于短期排查刷新历史。
  refresh_job_completed_retention_days: 7

  # 刷新失败的 refresh job 记录保留天数；失败记录保留更久便于排查和重试。
  refresh_job_failed_retention_days: 30

  # 清理任务保留缓存的最大天数；应不小于仍可能被读取的缓存有效期。
  cleanup_max_age_days: 30

  # 每个 source/cache/config 组合至少保留的最新缓存版本数。
  keep_latest_per_source: 2

  # 是否启用后台清理任务。
  cleanup_background_enabled: true

  # 后台清理任务每天运行的小时，按 cleanup_timezone 解释。
  cleanup_run_hour: 1

  # 后台清理任务每天运行的分钟，按 cleanup_timezone 解释。
  cleanup_run_minute: 0

  # 后台清理任务使用的时区。
  cleanup_timezone: "Asia/Shanghai"

  # 后台清理任务锁文件路径，用于避免重复清理进程并发运行。
  cleanup_lock_path: "data/user_cache/cleanup.lock"
